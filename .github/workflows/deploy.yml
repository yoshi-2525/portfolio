name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDCでAWSのロールを引き受けるために必要
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 一時的な確認用：GitHub が AWS に送る OIDC トークンの中身と、Secret のロール ARN の形を表示する
      - name: Debug OIDC
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('iss','aud','sub')},indent=2))" "$TOKEN"
          echo "ARN length: ${#ROLE_ARN}"
          echo "ARN account: $(echo "$ROLE_ARN" | cut -d: -f5)"
          echo "ARN resource: $(echo "$ROLE_ARN" | cut -d: -f6)"
          if [[ "$ROLE_ARN" =~ [[:space:]] ]]; then echo "WARNING: ARN contains whitespace"; fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # ハッシュ付きのアセットは長期キャッシュ、index.html などは毎回確認させる
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "index.html" --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" \
            --exclude "*" --include "index.html" --include "robots.txt" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/robots.txt"
