name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDCでAWSのロールを引き受けるために必要
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      # ハッシュ付きのアセットは長期キャッシュ、index.html などは毎回確認させる
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "index.html" --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" \
            --exclude "*" --include "index.html" --include "robots.txt" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/robots.txt"
